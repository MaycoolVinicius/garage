spring.application.name=oficina
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-horas=8
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

spring.servlet.multipart.max-file-size=600KB
spring.servlet.multipart.max-request-size=700KB