<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ordem de Serviço</title>
    <style>
        @page { size: A4; margin: 20mm; }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 11pt; color: #222; }
        .cabecalho { border-bottom: 2px solid #222; padding-bottom: 8px; margin-bottom: 16px; }
        .cabecalho h1 { margin: 0; font-size: 18pt; }
        .cabecalho p { margin: 2px 0 0 0; font-size: 10pt; color: #555; }
        h2 { font-size: 12pt; margin: 16px 0 6px 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 6px; text-align: left; }
        th { background-color: #eee; }
        td.num, th.num { text-align: right; }
        .total { text-align: right; font-size: 13pt; font-weight: bold; margin-top: 12px; }
    </style>
</head>
<body>
<div class="cabecalho">
    <h1>Centro Automotivo Paraná</h1>
    <p th:text="'Ordem de Serviço nº ' + ${os.id} + ' · ' + ${#temporals.format(os.dataAbertura, 'dd/MM/yyyy HH:mm')}">Ordem de Serviço</p>
</div>

<h2>Cliente e veículo</h2>
<p>
    Cliente: <span th:text="${os.nomeCliente}">Nome</span><br/>
    Telefone: <span th:text="${os.telefone}">Telefone</span><br/>
    Placa: <span th:text="${os.placa}">Placa</span>
</p>

<h2>Itens</h2>
<table>
    <thead>
    <tr>
        <th>Tipo</th>
        <th>Descrição</th>
        <th class="num">Qtd</th>
        <th class="num">Valor unit.</th>
        <th class="num">Subtotal</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${os.itens}">
        <td th:text="${item.tipo.name() == 'PECA'} ? 'Peça' : 'Serviço'">Tipo</td>
        <td th:text="${item.descricao}">Descrição</td>
        <td class="num" th:text="${item.quantidade}">1</td>
        <td class="num" th:text="'R$ ' + ${#numbers.formatDecimal(item.valorUnitario, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
        <td class="num" th:text="'R$ ' + ${#numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
    </tr>
    </tbody>
</table>

<p class="total" th:text="'Total: R$ ' + ${#numbers.formatDecimal(os.valorTotal, 1, 'POINT', 2, 'COMMA')}">Total</p>
</body>
</html>
